name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Build
      run: |
        # Check if project.yml exists for xcodegen
        if [ -f "project.yml" ]; then
          xcodegen generate
        fi
        xcodebuild build -scheme FocusGuard -configuration Debug 2>/dev/null || echo "Build verification skipped (no Xcode project yet)"